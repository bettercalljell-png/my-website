<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | The CharlieKirk file ของเรา</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <header>
        <h1>สมัครสมาชิก</h1>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="member1.html">สมาชิกคนที่ 1</a></li>
                <li><a href="member2.html">สมาชิกคนที่ 2</a></li>
                <li><a href="login.html">เข้าสู่ระบบ</a></li>
                <li><a href="register.html" class="active" aria-current="page">สมัครสมาชิก</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-card wide">
            <div class="auth-icon">📝</div>
            <h2>สร้างบัญชีใหม่</h2>
            <p class="auth-subtitle">กรอกข้อมูลด้านล่างเพื่อสมัครสมาชิก</p>

            <form id="registerForm" action="#" method="post">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrap">
                            <span class="icon">👤</span>
                            <input type="text" id="username" name="username"
                                   placeholder="กรอก Username" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrap has-toggle">
                            <span class="icon">🔒</span>
                            <input type="password" id="password" name="password"
                                   placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6"
                                   required autocomplete="new-password">
                            <button type="button" class="toggle-pass" data-target="password"
                                    aria-label="แสดง/ซ่อนรหัสผ่าน">👁️</button>
                        </div>
                    </div>

                    <div class="form-group full">
                        <label for="fullname">ชื่อ-สกุล</label>
                        <div class="input-wrap">
                            <span class="icon">🪪</span>
                            <input type="text" id="fullname" name="fullname"
                                   placeholder="กรอกชื่อ-สกุล" required autocomplete="name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrap">
                            <span class="icon">✉️</span>
                            <input type="email" id="email" name="email"
                                   placeholder="example@email.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">เบอร์โทรศัพท์</label>
                        <div class="input-wrap">
                            <span class="icon">📱</span>
                            <input type="tel" id="phone" name="phone"
                                   placeholder="0812345678" pattern="[0-9]{9,10}"
                                   title="กรอกตัวเลข 9-10 หลัก" required autocomplete="tel">
                        </div>
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-confirm">ยืนยัน</button>
                    <button type="button" class="btn btn-cancel"
                            onclick="window.location.href='index.html'">ยกเลิก</button>
                </div>
            </form>

            <p class="auth-link">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
        </div>
    </main>

    <a href="index.html" class="home-btn">⌂ หน้าแรก</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
    // แสดง/ซ่อนรหัสผ่าน
    document.querySelectorAll('.toggle-pass').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.dataset.target);
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.textContent = show ? '🙈' : '👁️';
        });
    });

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const submitBtn = e.target.querySelector('.btn-confirm');
        submitBtn.disabled = true;

        try {
            const username = document.getElementById('username').value.trim();
            if (username.includes('@') || /\s/.test(username))
                throw new Error('Username ห้ามมี @ หรือช่องว่าง');

            const { data, error } = await sb.auth.signUp({
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                options: {
                    data: {                       // ข้อมูลนี้จะถูก trigger เอาไปใส่ตาราง profiles
                        username: username,
                        fullname: document.getElementById('fullname').value.trim(),
                        phone: document.getElementById('phone').value.trim()
                    }
                }
            });

            if (error) {
                if (/already registered/i.test(error.message))
                    throw new Error('Email นี้ถูกใช้แล้ว');
                if (/database error/i.test(error.message))
                    throw new Error('Username นี้ถูกใช้แล้ว');
                throw new Error(error.message);
            }

            if (data.session) {
                // ปิดการยืนยันอีเมลไว้ → ล็อกอินให้เลย
                alert('สมัครสมาชิกสำเร็จ');
                window.location.href = 'index.html';
            } else {
                alert('สมัครสมาชิกสำเร็จ กรุณาตรวจอีเมลเพื่อกดยืนยันบัญชี');
                window.location.href = 'login.html';
            }
        } catch (err) {
            alert(err.message);
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
